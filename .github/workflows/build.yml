name: Build

on:
  push:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install Node Packages
        run: npm ci
      - name: Build Site
        run: npm run build
